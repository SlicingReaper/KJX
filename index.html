<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KJX</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
  </head>
  <body>
    <div id="globe"></div>

    <header id="brand">
      <div class="logo">KJX<span>//</span>GLOBE</div>
      <div class="tag">WRECK · CRASH · TREASURE INDEX</div>
    </header>

    <div id="hud" class="term"></div>

    <div id="zoom">
      <button data-zoom="in" title="Zoom in (+)">+</button>
      <button data-zoom="out" title="Zoom out (−)">−</button>
      <button data-zoom="home" title="Whole globe (H)">⌂</button>
      <button data-zoom="north" title="Face north (N)">N</button>
    </div>

    <div id="tooltip" class="term" hidden></div>

    <aside id="detail" class="term" hidden>
      <div class="dhead"><span class="glow">FILE//<span id="dsrc">CURATED</span></span><button class="close" title="Close (Esc)">ESC ✕</button></div>
      <div class="scroll"><div class="detail-body"></div></div>
    </aside>

    <aside id="panel" class="term">
      <div class="phead"><span class="glow">KJX//NAV</span><span id="online"><span class="blink glow">●</span> <span class="dim">LOADING</span></span></div>
      <nav class="tabs">
        <button data-tab="globes" class="active">GLOBES</button>
        <button data-tab="filters">FILTER</button>
        <button data-tab="list">INDEX</button>
        <button data-tab="myths">MYTHS</button>
        <button data-tab="offline">OFFLINE</button>
      </nav>
      <section data-pane="globes" class="pane active"></section>
      <section data-pane="filters" class="pane"></section>
      <section data-pane="list" class="pane"></section>
      <section data-pane="myths" class="pane"></section>
      <section data-pane="offline" class="pane"></section>
      <footer id="stats"></footer>
    </aside>

    <div id="loading">&gt; CHARTING THE SEVEN SEAS_</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
